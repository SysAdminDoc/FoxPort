name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parse:
    name: AST + import + GUI bootstrap
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.4

      - name: AST-parse every Python file
        run: |
          python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in pathlib.Path('foxport').rglob('*.py')]; print('OK')"

      - name: Import smoke (no GUI on Linux runner without display)
        if: runner.os != 'Linux'
        run: |
          python -c "from foxport.gui.main_window import MainWindow, install_theme; print('import OK')"

      - name: CLI --version
        run: |
          python -m foxport.cli --version

      - name: CLI --help (must stay ASCII-safe for legacy Windows consoles)
        run: |
          python -m foxport.cli --help

      - name: CLI list (allowed to find zero profiles in CI)
        run: |
          python -m foxport.cli list

      - name: Run unit tests
        env:
          # GUI smoke tests instantiate QApplication; the offscreen platform
          # plugin keeps them headless on the Linux runner which has no
          # display server.
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -ra -q
