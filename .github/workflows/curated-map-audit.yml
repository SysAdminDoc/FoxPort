name: Curated extension map audit

# Runs the AMO health check on the first of every month and on demand.
# Fails the workflow if any curated entry is missing or disabled on AMO;
# stale entries are reported but don't fail (override with --strict-stale).
on:
  schedule:
    - cron: "0 6 1 * *"     # 06:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      strict_stale:
        description: "Fail on entries older than --stale-months"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write              # so the workflow can file an issue on failure

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run auditor
        id: audit
        run: |
          flags=()
          if [ "${{ inputs.strict_stale }}" = "true" ]; then
            flags+=("--strict-stale")
          fi
          # --include-reverse audits the AMO_GUID -> Chrome ID table used
          # by migrate-reverse; reverse direction degrades silently when
          # GUIDs go missing on AMO so the monthly cron should catch it.
          flags+=("--include-reverse")
          python scripts/check_curated_map.py --json audit.json ${flags[@]}
        continue-on-error: true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated-map-audit
          path: audit.json
      - name: File issue on failure
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            // v1.3 split report into {forward: {...}, reverse: {...}}. Old
            // reports (pre-1.3) used the flat shape; tolerate both so the
            // workflow doesn't fail to file an issue on a partial rollout.
            const forward = report.forward || report;
            const reverse = report.reverse || {};
            const brokenForward = Object.entries(forward)
                .filter(([_, info]) => info && (info.status !== 'ok' || info.is_disabled));
            const brokenReverse = Object.entries(reverse)
                .filter(([_, info]) => info && (info.status !== 'ok' || info.is_disabled));
            const lines = [
              `The monthly AMO audit found ${brokenForward.length} broken / disabled forward entries and ${brokenReverse.length} broken / disabled reverse entries.`,
              '',
            ];
            if (brokenForward.length) {
              lines.push('## Forward (Chrome ID -> AMO slug)', '',
                '| Chrome ID | Slug | Status |',
                '|---|---|---|');
              for (const [id, info] of brokenForward) {
                lines.push(`| \`${id}\` | \`${info.slug}\` | ${info.is_disabled ? 'is_disabled' : info.status} |`);
              }
              lines.push('');
            }
            if (brokenReverse.length) {
              lines.push('## Reverse (AMO GUID -> Chrome ID)', '',
                '| AMO GUID | Chrome ID | Status |',
                '|---|---|---|');
              for (const [guid, info] of brokenReverse) {
                lines.push(`| \`${guid}\` | \`${info.chrome_id}\` | ${info.is_disabled ? 'is_disabled' : info.status} |`);
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Curated extension map audit ${new Date().toISOString().slice(0,10)}`,
              body: lines.join('\n'),
              labels: ['curated-map'],
            });
