name: Curated extension map audit

# Runs the AMO health check on the first of every month and on demand.
# Fails the workflow if any curated entry is missing or disabled on AMO;
# stale entries are reported but don't fail (override with --strict-stale).
on:
  schedule:
    - cron: "0 6 1 * *"     # 06:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      strict_stale:
        description: "Fail on entries older than --stale-months"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write              # so the workflow can file an issue on failure

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run auditor
        id: audit
        run: |
          flags=()
          if [ "${{ inputs.strict_stale }}" = "true" ]; then
            flags+=("--strict-stale")
          fi
          python scripts/check_curated_map.py --json audit.json ${flags[@]}
        continue-on-error: true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated-map-audit
          path: audit.json
      - name: File issue on failure
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const broken = Object.entries(report)
                .filter(([_, info]) => info.status !== 'ok' || info.is_disabled);
            const body = [
              `The monthly AMO audit found ${broken.length} broken or disabled entries in the curated extension map.`,
              '',
              '| Chrome ID | Slug | Status |',
              '|---|---|---|',
              ...broken.map(([id, info]) =>
                  `| \`${id}\` | \`${info.slug}\` | ${info.is_disabled ? 'is_disabled' : info.status} |`),
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Curated extension map audit ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['curated-map'],
            });
