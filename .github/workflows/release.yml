name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Must match foxport/__init__.py __version__."
        required: true
        type: string
      prerelease:
        description: "Mark this release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # OIDC token + Sigstore attestation writes for SLSA build provenance
  # via actions/attest-build-provenance. Required for keyless signing.
  id-token: write
  attestations: write

jobs:
  windows:
    name: Build Windows artifacts (FoxPort + foxport_abe sidecar)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = (Select-String -Path foxport/__init__.py -Pattern '__version__ = "(.+)"').Matches.Groups[1].Value
          $tag = "${{ inputs.tag }}".TrimStart("v")
          if ($version -ne $tag) {
            Write-Error "foxport/__init__.py __version__=$version does not match input tag v$tag"
            exit 1
          }
          Write-Host "Version $version matches tag ${{ inputs.tag }}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build ABE sidecar
        shell: pwsh
        working-directory: tools/abe_sidecar
        run: |
          cmake -B build -A x64
          cmake --build build --config Release
          Copy-Item build/Release/foxport_abe.exe ../../foxport/data/foxport_abe.exe

      - name: Generate version_info.txt for the Windows EXE
        shell: pwsh
        run: |
          # PyInstaller picks up assets/version_info.txt when present in
          # foxport.spec. Generate it from __version__ + the input tag so
          # File Version / Product Version metadata in the built EXE matches.
          $version = (Select-String -Path foxport/__init__.py -Pattern '__version__ = "(.+)"').Matches.Groups[1].Value
          $parts = $version.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $tuple = ($parts -join ",")
          $content = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($tuple),
              prodvers=($tuple),
              mask=0x3f, flags=0x0, OS=0x4, fileType=0x1,
              subtype=0x0, date=(0, 0)
            ),
            kids=[
              StringFileInfo(
                [StringTable(
                  '040904B0',
                  [StringStruct('CompanyName', 'SysAdminDoc'),
                   StringStruct('FileDescription', 'FoxPort - Chromium to Firefox migration'),
                   StringStruct('FileVersion', '$version'),
                   StringStruct('InternalName', 'FoxPort'),
                   StringStruct('LegalCopyright', 'MIT licensed'),
                   StringStruct('OriginalFilename', 'FoxPort.exe'),
                   StringStruct('ProductName', 'FoxPort'),
                   StringStruct('ProductVersion', '$version')]
                )]
              ),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          "@
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          Set-Content -Path assets/version_info.txt -Value $content
          Write-Host "Wrote assets/version_info.txt for version $version"

      - name: Build FoxPort PyInstaller bundle
        shell: pwsh
        run: |
          pyinstaller foxport.spec --noconfirm --clean

      - name: Sign Windows artifacts (when cert secret is present)
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # No-op when the cert secret isn't set so forks can ship unsigned
          # debug builds. Production releases must set both secrets; the
          # step then decodes the base64-encoded PFX, calls SignTool over
          # FoxPort.exe + foxport_abe.exe with a public timestamp authority,
          # and removes the cert from disk.
          if (-not $env:WINDOWS_CERT_BASE64) {
            Write-Host "Skipping signing — WINDOWS_CERT_BASE64 secret not set."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "foxport-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found on the runner" }
          foreach ($exe in @("dist/FoxPort/FoxPort.exe", "dist/FoxPort/foxport/data/foxport_abe.exe")) {
            if (-not (Test-Path $exe)) { continue }
            & $signtool sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $exe" }
            & $signtool verify /pa $exe
          }
          Remove-Item $certPath -Force

      - name: Smoke-test packaged EXE
        shell: pwsh
        run: |
          # The packaged GUI EXE is windowed so it can't print --version to
          # the console directly. Instead we verify the EXE exists, has the
          # expected version resource (when signed/generated), and the
          # bundled curated_extension_map.json is reachable.
          $exe = "dist/FoxPort/FoxPort.exe"
          if (-not (Test-Path $exe)) { throw "$exe missing after build" }
          $info = (Get-Item $exe).VersionInfo
          Write-Host "EXE FileVersion: $($info.FileVersion)"
          Write-Host "EXE ProductVersion: $($info.ProductVersion)"
          $tagVersion = "${{ inputs.tag }}".TrimStart("v")
          if ($info.FileVersion -and ($info.FileVersion -notlike "$tagVersion*")) {
            throw "FileVersion '$($info.FileVersion)' does not start with tag '$tagVersion'"
          }
          if (-not (Test-Path "dist/FoxPort/foxport/data/curated_extension_map.json")) {
            throw "curated_extension_map.json missing from bundle"
          }

      - name: Package bundle as ZIP
        shell: pwsh
        run: |
          $zip = "FoxPort-${{ inputs.tag }}-windows-x64.zip"
          Compress-Archive -Path dist/FoxPort/* -DestinationPath $zip
          Write-Host "Created $zip"
          $hash = Get-FileHash $zip -Algorithm SHA256
          $hash | Format-List
          # Emit a separate .sha256 sidecar so users can verify the
          # downloaded archive without re-hashing it by hand.
          "$($hash.Hash)  $zip" | Set-Content "$zip.sha256"
          "ZIP_NAME=$zip" >> $env:GITHUB_ENV
          "ZIP_SHA256_NAME=$zip.sha256" >> $env:GITHUB_ENV

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          # Describes the FoxPort Python runtime dependency tree. The
          # SBOM is emitted from the pinned requirements.txt so what
          # ships in the bundle matches what's attested below. Filename
          # carries the release tag so users downloading multiple
          # versions can tell SBOMs apart.
          pip install cyclonedx-bom==7.3.0
          $sbom = "FoxPort-${{ inputs.tag }}-sbom.cdx.json"
          cyclonedx-py requirements --of JSON --mc-type application -o $sbom requirements.txt
          if (-not (Test-Path $sbom)) { throw "SBOM not generated" }
          "SBOM_NAME=$sbom" >> $env:GITHUB_ENV

      - name: Attest build provenance (SLSA / Sigstore keyless)
        # Generates a SLSA build provenance attestation for the Windows
        # ZIP + the SBOM via GitHub's OIDC + Sigstore Rekor. No keys
        # are required; verifiers use `gh attestation verify`.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.ZIP_NAME }}
            ${{ env.SBOM_NAME }}

      - name: Generate signed WinSparkle appcast (when key secret is present)
        shell: pwsh
        env:
          WINSPARKLE_EDDSA_PRIVATE_KEY_BASE64: ${{ secrets.WINSPARKLE_EDDSA_PRIVATE_KEY_BASE64 }}
        run: |
          if (-not $env:WINSPARKLE_EDDSA_PRIVATE_KEY_BASE64) {
            Write-Host "Skipping appcast - WINSPARKLE_EDDSA_PRIVATE_KEY_BASE64 secret not set."
            exit 0
          }
          $version = "${{ inputs.tag }}".TrimStart("v")
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/$env:ZIP_NAME"
          $releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}"
          python scripts/generate_winsparkle_appcast.py `
            --artifact "$env:ZIP_NAME" `
            --version "$version" `
            --download-url "$downloadUrl" `
            --release-notes-url "$releaseNotesUrl" `
            --private-key-base64 "$env:WINSPARKLE_EDDSA_PRIVATE_KEY_BASE64" `
            --output appcast.xml
          "APPCAST_NAME=appcast.xml" >> $env:GITHUB_ENV

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxPort-windows-x64
          if-no-files-found: warn
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_SHA256_NAME }}
            ${{ env.SBOM_NAME }}
            appcast.xml

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the tag (signed by the actions[bot] account) and the release.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.tag }}" -m "Release ${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"
          $prereleaseFlag = if ("${{ inputs.prerelease }}" -eq "true") { "--prerelease" } else { "" }
          $assets = @("$env:ZIP_NAME", "$env:ZIP_SHA256_NAME")
          if ($env:SBOM_NAME -and (Test-Path $env:SBOM_NAME)) {
            $assets += $env:SBOM_NAME
          }
          if ($env:APPCAST_NAME -and (Test-Path $env:APPCAST_NAME)) {
            $assets += $env:APPCAST_NAME
          }
          $argList = @("release", "create", "${{ inputs.tag }}") + $assets + @(
            "--title", "FoxPort ${{ inputs.tag }}",
            "--notes-file", "CHANGELOG.md"
          )
          if ($prereleaseFlag) { $argList += $prereleaseFlag }
          & gh $argList
