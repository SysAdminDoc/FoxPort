name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Must match foxport/__init__.py __version__."
        required: true
        type: string
      prerelease:
        description: "Mark this release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows artifacts (FoxPort + foxport_abe sidecar)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = (Select-String -Path foxport/__init__.py -Pattern '__version__ = "(.+)"').Matches.Groups[1].Value
          $tag = "${{ inputs.tag }}".TrimStart("v")
          if ($version -ne $tag) {
            Write-Error "foxport/__init__.py __version__=$version does not match input tag v$tag"
            exit 1
          }
          Write-Host "Version $version matches tag ${{ inputs.tag }}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build ABE sidecar
        shell: pwsh
        working-directory: tools/abe_sidecar
        run: |
          cmake -B build -A x64
          cmake --build build --config Release
          Copy-Item build/Release/foxport_abe.exe ../../foxport/data/foxport_abe.exe

      - name: Build FoxPort PyInstaller bundle
        shell: pwsh
        run: |
          pyinstaller foxport.spec --noconfirm --clean

      - name: Package bundle as ZIP
        shell: pwsh
        run: |
          $zip = "FoxPort-${{ inputs.tag }}-windows-x64.zip"
          Compress-Archive -Path dist/FoxPort/* -DestinationPath $zip
          Write-Host "Created $zip"
          Get-FileHash $zip -Algorithm SHA256 | Format-List
          "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxPort-windows-x64
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the tag (signed by the actions[bot] account) and the release.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.tag }}" -m "Release ${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"
          $prereleaseFlag = if ("${{ inputs.prerelease }}" -eq "true") { "--prerelease" } else { "" }
          $argList = @(
            "release", "create", "${{ inputs.tag }}",
            "$env:ZIP_NAME",
            "--title", "FoxPort ${{ inputs.tag }}",
            "--notes-file", "CHANGELOG.md"
          )
          if ($prereleaseFlag) { $argList += $prereleaseFlag }
          & gh $argList
